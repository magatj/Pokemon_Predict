# Continuous integration: the same checks the GitLab pipeline runs.
#
# Ingestion and deployment live in ingest.yml and pages.yml; this workflow only
# validates, so it is safe to run on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/apps/ingestion

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ingestion/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/ingestion/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate configuration
        # Fails fast if scoring weights do not sum to 1.0, a weight is out of
        # range, or either YAML file is malformed.
        run: |
          python -c "from pokevend.config import load_config; c = load_config(); print('config OK:', c.forecast.zip_code, c.forecast.radius_miles)"

      - name: Test
        run: pytest --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml
          retention-days: 7

  web:
    name: Web (eslint + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  terraform:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure/terraform
