# Build the dashboard and publish it to GitHub Pages.
#
# Requires GitHub Pages to be available for the repository. On a free plan that
# means the repository must be PUBLIC - private-repo Pages needs a paid plan.
# `enablement: true` turns Pages on automatically as soon as it is available, so
# no manual Settings step is needed; until then this workflow fails at the
# configure step with "Get Pages site failed".
#
# The site is served from https://<owner>.github.io/<repo>/, so Vite needs that
# project path as its base; VITE_BASE_PATH is set from the repository name.
# index.html is copied to 404.html because Pages serves static files only and
# the dashboard uses client-side routing - without the copy, a deep link to a
# machine page 404s on refresh.
#
# Also callable from ingest.yml, so freshly ingested data is deployed straight
# away. (A commit made with GITHUB_TOKEN does not trigger other workflows, so
# the scheduled job has to invoke this one explicitly.)

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the branch tip, not the SHA that started the run.
          #
          # When ingest.yml calls this workflow it has just pushed a data
          # commit, but a reusable workflow inherits the caller's triggering
          # SHA - which is main as it was *before* ingestion. Checking out that
          # SHA republishes the previous data, leaving the site permanently one
          # cycle behind while still reporting a successful deploy.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on by itself rather than requiring a Settings visit.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
