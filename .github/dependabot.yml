version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the dev toolchain rather than five; runtime deps stay
      # separate so a React or Recharts bump is reviewed on its own.
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: pip
    directory: /apps/ingestion
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
