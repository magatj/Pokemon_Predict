[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokevend"
version = "0.1.0"
description = "Ingestion, normalization and forecasting for Pokemon Vending Forecast"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["pokevend*"]
